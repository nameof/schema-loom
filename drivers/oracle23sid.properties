# Oracle 23 驱动描述：SID 连接方式
# 与 oracle23.properties 的区别只有 urlTemplate —— SID 语法是 jdbc:oracle:thin:@host:port:SID，
# 服务名语法是 jdbc:oracle:thin:@//host:port/SERVICE，两者不可互换。
# 由调用方通过 DatabaseConnectionInfo.driverId 显式指定本描述文件（dbmask 按 connectionType 决定）。
# priority 与 oracle23 相同：未显式指定 driverId 的历史路径会先试服务名语法，
# 失败后由 JdbcDriverLoader 按 id 字典序降级到 SID 语法。
id=oracle23sid
databaseType=ORACLE
driverClass=oracle.jdbc.OracleDriver
classpath=ojdbc8-23.26.3.0.0.jar
urlPrefixes=jdbc:oracle:
urlTemplate=jdbc:oracle:thin:@${host}:${port}:${database}
priority=20
serverVersionRange=[12.0,27.0)
driverPackages=oracle.jdbc,oracle
defaultProperties=oracle.jdbc.timezoneAsRegion=false;oracle.net.CONNECT_TIMEOUT=10000
